# Loaded by the host PF policy after the three tables are populated with
# independently approved literal IP addresses. Hostnames are never used here.
table <vnpyresearch_dns> persist
table <vnpyresearch_ntp> persist
table <vnpyresearch_registry_https> persist

pass out quick proto { udp tcp } from any to <vnpyresearch_dns> port 53 user vnpyresearch
pass out quick proto udp from any to <vnpyresearch_ntp> port 123 user vnpyresearch
pass out quick proto tcp from any to <vnpyresearch_registry_https> port 443 user vnpyresearch
block return out log quick user vnpyresearch
