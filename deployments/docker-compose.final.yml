# Issue #291 final validation graph.  It is deliberately non-production and
# starts no batch producer, signer, private key, or broker authorisation.
name: vnpy-web-bridge-final-runtime

services:
  frontend-edge:
    image: ${FRONTEND_IMAGE:-vnpy-web-bridge-frontend:final}
    build: { context: .., dockerfile: frontend/Containerfile }
    environment: &negative_flags
      PRODUCTION: "false"
      LIVE_TRADING_AUTHORIZED: "false"
      COUNTABLE_FORWARD: "false"
    ports: ["${FINAL_FRONTEND_PORT:-8080}:8080"]
    networks: [edge, edge-control]
    depends_on: { control-api: { condition: service_healthy } }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]

  control-api:
    image: ${CONTROL_API_IMAGE:-vnpy-web-bridge-control-api:final}
    build: { context: .., dockerfile: deployments/phase-a/Containerfile.control-api }
    expose: ["8081"]
    environment:
      <<: *negative_flags
      APP_ENV: final-validation
      CONTROL_EXECUTION_BASE_URL: http://execution-orchestrator:8090
      CONTROL_EXECUTION_SHARED_SECRET: ${CONTROL_EXECUTION_SHARED_SECRET:?required}
      CONTROL_EXECUTION_PRINCIPAL: ${CONTROL_EXECUTION_PRINCIPAL:?required}
      CONTROL_EXECUTION_ROLE: ${CONTROL_EXECUTION_ROLE:?required}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:?required}
      DATABASE_URL: ${CONTROL_DATABASE_URL:?required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?required}
      AUTH_USERS_JSON: ${AUTH_USERS_JSON:?required}
      WEB_TRADE_ENABLED: "false"
      PHASE_C_CUSTODY_URL: http://artifact-custody:8091
      PHASE_C_CUSTODY_SHARED_SECRET: ${PHASE_C_CUSTODY_SHARED_SECRET:?required}
      PHASE_C_EXECUTION_URL: http://execution-orchestrator:8090
      PHASE_C_EXECUTION_SHARED_SECRET: ${PHASE_C_EXECUTION_SHARED_SECRET:?required}
    networks: [edge-control, private-control, control-custody, control-data]
    volumes: [control_state:/var/lib/vnpy-control]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; assert urllib.request.urlopen(\"http://127.0.0.1:8081/health/ready\",timeout=2).status==200'"]
      interval: 10s
      timeout: 3s
      retries: 12

  execution-orchestrator:
    image: ${EXECUTION_IMAGE:-vnpy-web-bridge-execution:final}
    build: { context: .., dockerfile: deployments/phase-a/Containerfile.execution-orchestrator }
    expose: ["8090"]
    environment:
      <<: *negative_flags
      APP_ENV: final-validation
      EXECUTION_ORCHESTRATOR_PORT: "8090"
      CONTROL_EXECUTION_SHARED_SECRET: ${CONTROL_EXECUTION_SHARED_SECRET:?required}
      CONTROL_EXECUTION_PRINCIPAL: ${CONTROL_EXECUTION_PRINCIPAL:?required}
      CONTROL_EXECUTION_ROLE: ${CONTROL_EXECUTION_ROLE:?required}
      EXECUTION_SCOPE: ${EXECUTION_SCOPE:?required}
      EXECUTION_ENVIRONMENT: SIMNOW
      EXECUTION_STATE_PATH: /var/lib/vnpy-execution/state.json
      EXECUTION_TERMINAL_ARCHIVE_PATH: /var/lib/vnpy-execution/archive
      EXECUTION_AUDIT_PATH: /var/lib/vnpy-execution/audit/audit.jsonl
      EXECUTION_TARGET_PLAN_ROOT: /var/lib/vnpy-execution/target-plans
      EXECUTION_CUSTODY_URL: http://artifact-custody:8091
      EXECUTION_CUSTODY_SECRET: ${PHASE_C_CUSTODY_EXECUTION_READ_SECRET:?required}
      EXECUTION_ALLOWED_SCOPE_JSON: ${EXECUTION_ALLOWED_SCOPE_JSON:?required}
      EXECUTION_SIMNOW_MAX_ORDER_VOLUME: "1"
      FINAL_EXECUTION_RUNTIME_REQUIRED: "true"
      EXECUTION_ALLOW_SIMNOW_EXECUTION: "false"
      DATABASE_URL: ${EXECUTION_DATABASE_URL:?required}
      EXECUTION_RPC_REQ_ADDRESS: tcp://gateway-rpc-request-proxy:${GATEWAY_RPC_REQ_PROXY_PORT:?required}
      EXECUTION_RPC_PUB_ADDRESS: tcp://gateway-rpc-publish-proxy:${GATEWAY_RPC_PUB_PROXY_PORT:?required}
      GATEWAY_PROXY_HEALTH_PORT: "18080"
      WEB_TRADE_ENABLED: "false"
    networks: [private-control, execution-custody, execution-data, gateway-proxy]
    depends_on:
      artifact-custody: { condition: service_healthy }
      postgres: { condition: service_healthy }
      gateway-rpc-request-proxy: { condition: service_healthy }
      gateway-rpc-publish-proxy: { condition: service_healthy }
    volumes: [execution_state:/var/lib/vnpy-execution]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

  artifact-custody:
    image: ${ARTIFACT_CUSTODY_IMAGE:-vnpy-web-bridge-artifact-custody:final}
    build: { context: .., dockerfile: deployments/phase-b/Containerfile.artifact-custody }
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["app.phase_c_custody:app", "--host", "0.0.0.0", "--port", "8091"]
    expose: ["8091"]
    environment:
      <<: *negative_flags
      PHASE_C_CUSTODY_ROOT: /var/lib/phase-c-custody
      PHASE_C_CUSTODY_WRITER_EPOCH: ${CUSTODY_WRITER_EPOCH:?required}
      PHASE_C_CUSTODY_SHARED_SECRET: ${PHASE_C_CUSTODY_SHARED_SECRET:?required}
      PHASE_C_CUSTODY_EXECUTION_READ_SECRET: ${PHASE_C_CUSTODY_EXECUTION_READ_SECRET:?required}
      PHASE_C_CUSTODY_POLICIES_JSON: ${PHASE_C_CUSTODY_POLICIES_JSON:?required}
      PHASE_C_CUSTODY_PROJECTION_DIR: /var/lib/phase-b/projection
    networks: [control-custody, execution-custody]
    volumes:
      - artifact_custody_state:/var/lib/phase-c-custody
      - artifact_custody_projection:/var/lib/phase-b/projection
      # Public verification material only; private signing keys never enter
      # this graph.
      - ${PHASE_C_CUSTODY_PUBLIC_KEYRING_DIR:?required}:/run/keys:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8091/health/ready',timeout=2).status==200"]
      interval: 10s
      timeout: 3s
      retries: 12

  gateway-rpc-request-proxy:
    image: ${GATEWAY_PROXY_IMAGE:-vnpy-web-bridge-gateway-proxy:final}
    build: { context: .., dockerfile: deployments/phase-a/Containerfile.gateway-proxy }
    command: [request]
    environment:
      <<: *negative_flags
      PROXY_LISTEN_PORT: ${GATEWAY_RPC_REQ_PROXY_PORT:?required}
      PROXY_HEALTH_PORT: "18080"
      WINDOWS_RPC_REQ_ADDRESS: ${WINDOWS_RPC_REQ_ADDRESS:?required}
    networks: [gateway-proxy, gateway-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck: { test: ["CMD", "python", "/usr/local/bin/gateway_proxy.py", "health"], interval: 10s, timeout: 3s, retries: 6 }

  gateway-rpc-publish-proxy:
    image: ${GATEWAY_PROXY_IMAGE:-vnpy-web-bridge-gateway-proxy:final}
    build: { context: .., dockerfile: deployments/phase-a/Containerfile.gateway-proxy }
    command: [publish]
    environment:
      <<: *negative_flags
      PROXY_LISTEN_PORT: ${GATEWAY_RPC_PUB_PROXY_PORT:?required}
      PROXY_HEALTH_PORT: "18080"
      WINDOWS_RPC_PUB_ADDRESS: ${WINDOWS_RPC_PUB_ADDRESS:?required}
    networks: [gateway-proxy, gateway-egress, market-ingress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck: { test: ["CMD", "python", "/usr/local/bin/gateway_proxy.py", "health"], interval: 10s, timeout: 3s, retries: 6 }

  questdb:
    image: questdb/questdb:9.4.3
    networks: [questdb-data]
    volumes: [questdb_state:/var/lib/questdb]
    healthcheck: { test: ["CMD-SHELL", "response=\"$$(curl -fsS 'http://127.0.0.1:9000/exec?query=select%201')\" && printf '%s' \"$$response\" | grep -Eq '\"dataset\"[[:space:]]*:[[:space:]]*\\[[[:space:]]*\\[[[:space:]]*1[[:space:]]*\\][[:space:]]*\\]'"], interval: 10s, timeout: 3s, retries: 12 }

  questdb-schema-bootstrap:
    image: postgres:16-alpine
    networks: [questdb-data]
    depends_on: { questdb: { condition: service_healthy } }
    configs: [{ source: market_ticks_schema, target: /bootstrap/market_ticks.sql, mode: 0444 }]
    command: ["sh", "-ec", "until pg_isready -h questdb -p 8812 -U admin; do sleep 1; done; psql -v ON_ERROR_STOP=1 -h questdb -p 8812 -U admin -d qdb -f /bootstrap/market_ticks.sql"]
    environment: { PGPASSWORD: quest }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

  market-data-worker:
    image: ${MARKET_DATA_WORKER_IMAGE:-vnpy-web-bridge-market-data-worker:final}
    build: { context: .., dockerfile: deployments/phase-b/Containerfile.market-data-worker }
    command: ["--state-dir", "/var/lib/phase-b/market-data", "--run"]
    environment:
      <<: *negative_flags
      PHASE_B_RUNTIME_MODE: final-validation
      PHASE_B_MARKET_DATA_STATE_DIR: /var/lib/phase-b/market-data
      PHASE_B_MARKET_PROJECTION_DIR: /var/lib/phase-b/projection
      PHASE_B_MARKET_PUBLISH_ENDPOINT: tcp://gateway-rpc-publish-proxy:${GATEWAY_RPC_PUB_PROXY_PORT:?required}
      PHASE_B_QUESTDB_PG_DSN_FILE: /run/secrets/questdb-writer.dsn
    secrets: [{ source: questdb_writer_dsn, target: questdb-writer.dsn, uid: "65532", gid: "65532", mode: 0400 }]
    networks: [market-ingress, questdb-data]
    depends_on: { questdb-schema-bootstrap: { condition: service_completed_successfully } }
    volumes: [market_data_state:/var/lib/phase-b/market-data, market_projection:/var/lib/phase-b/projection]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

  execution-quality-worker:
    image: ${EXECUTION_QUALITY_WORKER_IMAGE:-vnpy-web-bridge-execution-quality-worker:final}
    build: { context: .., dockerfile: deployments/phase-b/Containerfile.execution-quality-worker }
    command: ["--state-dir", "/var/lib/phase-b/execution-quality", "--run"]
    environment: { <<: *negative_flags, PHASE_B_RUNTIME_MODE: final-validation, PHASE_B_EQ_STATE_DIR: /var/lib/phase-b/execution-quality, PHASE_B_VERIFIED_STREAM_DIR: /var/lib/market-data-stream/stream, PHASE_B_EQ_PROJECTION_DIR: /var/lib/phase-b/projection }
    network_mode: none
    depends_on: { market-data-worker: { condition: service_started } }
    volumes: [execution_quality_state:/var/lib/phase-b/execution-quality, execution_quality_projection:/var/lib/phase-b/projection, market_data_state:/var/lib/market-data-stream:ro]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

  monitor-worker:
    image: ${MONITOR_WORKER_IMAGE:-vnpy-web-bridge-monitor-worker:final}
    build: { context: .., dockerfile: deployments/phase-b/Containerfile.monitor-worker }
    command: ["--state-dir", "/var/lib/phase-b/monitor", "--run"]
    environment: { <<: *negative_flags, PHASE_B_RUNTIME_MODE: final-validation, PHASE_B_MONITOR_STATE_DIR: /var/lib/phase-b/monitor, PHASE_B_PROJECTION_DIR: /var/lib/phase-b/projections, PHASE_B_MONITOR_NOTIFIER_ENABLED: "false" }
    network_mode: none
    depends_on: { execution-quality-worker: { condition: service_started } }
    volumes: [monitor_state:/var/lib/phase-b/monitor, artifact_custody_projection:/var/lib/phase-b/projections/artifact-custody:ro, market_projection:/var/lib/phase-b/projections/market-data-worker:ro, execution_quality_projection:/var/lib/phase-b/projections/execution-quality-worker:ro]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

  map-producer:
    profiles: [batch]
    image: ${MAP_PRODUCER_IMAGE:-vnpy-web-bridge-map-producer:final}
    build: { context: .., dockerfile: deployments/phase-b/Containerfile.map-producer }
    environment: *negative_flags
    network_mode: none

  c-fast-producer:
    profiles: [batch]
    image: ${C_FAST_PRODUCER_IMAGE:-vnpy-web-bridge-c-fast-producer:final}
    build: { context: .., dockerfile: deployments/phase-b/Containerfile.c-fast-producer }
    environment: *negative_flags
    network_mode: none

  signing-authority:
    profiles: [offline-signing]
    image: ${SIGNING_AUTHORITY_IMAGE:-vnpy-web-bridge-signing-authority:final}
    build: { context: .., dockerfile: deployments/phase-b/Containerfile.signing-authority }
    environment: *negative_flags
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      CONTROL_DB_USER: ${CONTROL_DB_USER:?required}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?required}
      EXECUTION_DB_USER: ${EXECUTION_DB_USER:?required}
      EXECUTION_DB_PASSWORD: ${EXECUTION_DB_PASSWORD:?required}
    networks: [control-data, execution-data]
    volumes: [postgres_state:/var/lib/postgresql/data, ./phase-a/postgres-init.sh:/docker-entrypoint-initdb.d/10-phase-a-roles.sh:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 3s, retries: 12 }

networks:
  edge: { internal: false }
  edge-control: { internal: true }
  private-control: { internal: true }
  control-custody: { internal: true }
  execution-custody: { internal: true }
  control-data: { internal: true }
  execution-data: { internal: true }
  gateway-proxy: { internal: true }
  gateway-egress: { internal: false }
  market-ingress: { internal: true }
  questdb-data: { internal: true }

volumes:
  control_state:
  execution_state:
  artifact_custody_state:
  artifact_custody_projection:
  market_data_state:
  market_projection:
  execution_quality_state:
  execution_quality_projection:
  monitor_state:
  postgres_state:
  questdb_state:

secrets:
  questdb_writer_dsn:
    file: ${QUESTDB_WRITER_DSN_HOST_PATH:?required}

configs:
  market_ticks_schema:
    file: ./final/questdb-market-ticks.sql
