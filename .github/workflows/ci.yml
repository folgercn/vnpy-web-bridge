name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-quick.txt

      - name: Install quick-check dependencies
        run: pip install -r scripts/ci/requirements-quick.txt

      - name: Resolve changed files and check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$PULL_REQUEST_BASE_SHA" "$PULL_REQUEST_HEAD_SHA"
            git diff --check "$PULL_REQUEST_BASE_SHA" "$PULL_REQUEST_HEAD_SHA"
            git diff --name-only "$PULL_REQUEST_BASE_SHA" "$PULL_REQUEST_HEAD_SHA" > /tmp/changed-files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA" "$CURRENT_SHA"
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
          else
            git show --check --oneline "$CURRENT_SHA"
            git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA" > /tmp/changed-files.txt
          fi

      - name: Ruff and compile changed Python files
        shell: bash
        run: |
          mapfile -t python_files < <(while IFS= read -r file_path; do
            if [[ "$file_path" == *.py && -f "$file_path" ]]; then printf '%s\n' "$file_path"; fi
          done < /tmp/changed-files.txt)
          if (( ${#python_files[@]} )); then
            ruff check "${python_files[@]}"
            python -m py_compile "${python_files[@]}"
          fi

      - name: Validate the minimal CI contract
        run: python -m pytest -q backend/tests/unit/test_ci_workflow_contract.py

  simnow-lab-linux:
    name: SIMNOW_LAB and M2 target producer (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-quick.txt

      - name: Install focused dependencies
        run: |
          pip install -r scripts/ci/requirements-quick.txt
          pip install pyzmq==27.1.0 vnpy==4.4.0 --no-deps

      - name: Run M2 producer and SIMNOW_LAB focused tests
        env:
          PYTHONPATH: backend:scripts:.
        run: |
          python -m pytest -q \
            backend/tests/unit/test_commodity_static_core_equal_pure_producer.py \
            backend/tests/unit/test_simnow_experimental_monthly_once.py \
            backend/tests/unit/test_simnow_experimental_timely_daily_route.py \
            backend/tests/unit/test_issue462_simnow_lab_cli.py \
            backend/tests/unit/test_issue462_simnow_lab_m1.py \
            backend/tests/unit/test_windows_rpc_simnow_e2e_v1.py

  simnow-lab-windows:
    name: SIMNOW_LAB focused (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-quick.txt

      - name: Install focused Windows dependencies
        run: |
          pip install -r scripts/ci/requirements-quick.txt
          pip install pywin32==306 pyzmq==27.1.0 vnpy==4.4.0 --no-deps

      - name: Run SIMNOW_LAB focused tests
        run: >-
          python -m pytest -q
          backend/tests/unit/test_issue462_simnow_lab_cli.py
          backend/tests/unit/test_issue462_simnow_lab_m1.py
          backend/tests/unit/test_windows_rpc_simnow_e2e_v1.py

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - quick-checks
      - simnow-lab-linux
      - simnow-lab-windows
    runs-on: ubuntu-latest
    steps:
      - name: Require the minimal CI lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          invalid = {
              name: details["result"]
              for name, details in needs.items()
              if details["result"] != "success"
          }
          if invalid:
              raise SystemExit(f"required CI jobs failed or were cancelled: {invalid}")
          print("SIMNOW_LAB minimal CI passed")
          PY
