name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend_changed }}
      frontend_changed: ${{ steps.filter.outputs.frontend_changed }}
      image_changed: ${{ steps.filter.outputs.image_changed }}
      query_v5_changed: ${{ steps.filter.outputs.query_v5_changed }}
      windows_fence_changed: ${{ steps.filter.outputs.windows_fence_changed }}
      phase_a_changed: ${{ steps.phase_a_filter.outputs.phase_a_changed }}
      frontend_edge_changed: ${{ steps.phase_a_filter.outputs.frontend_edge_changed }}
      control_api_changed: ${{ steps.phase_a_filter.outputs.control_api_changed }}
      execution_orchestrator_changed: ${{ steps.phase_a_filter.outputs.execution_orchestrator_changed }}
      execution_changed: ${{ steps.phase_a_filter.outputs.execution_changed }}
      execution_safety_required: ${{ steps.phase_a_filter.outputs.execution_safety_required }}
      phase_a_release_blocked: ${{ steps.phase_a_filter.outputs.release_blocked }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git ls-tree -r --name-only "$CURRENT_SHA" > /tmp/changed-files.txt
            python scripts/ci/classify_changes.py --force-all --github-output >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --name-only "origin/$BASE_REF"...HEAD > /tmp/changed-files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
          else
            git ls-tree -r --name-only "$CURRENT_SHA" > /tmp/changed-files.txt
          fi

          python scripts/ci/classify_changes.py \
            --paths-file /tmp/changed-files.txt \
            --github-output >> "$GITHUB_OUTPUT"

      - name: Classify Issue #291 Phase A services
        id: phase_a_filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          extra=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then extra+=(--force-all); fi
          python scripts/ci/classify_changes.py \
            --paths-file /tmp/changed-files.txt \
            --phase-a --github-output "${extra[@]}" >> "$GITHUB_OUTPUT"
          status=$?
          # Unknown/ambiguous paths are represented in the output and are
          # failed by the dedicated release-plan job and CI Gate.  Keep this
          # change-detection job able to publish all booleans first.
          if [ "$status" -gt 1 ]; then exit "$status"; fi

  quick-checks:
    name: Quick checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-quick.txt

      - name: Install quick-check dependencies
        run: pip install -r scripts/ci/requirements-quick.txt

      - name: Resolve changed files and check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --check "origin/$BASE_REF"...HEAD
            git diff --name-only "origin/$BASE_REF"...HEAD > /tmp/changed-files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA" "$CURRENT_SHA"
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
          else
            git show --check --oneline "$CURRENT_SHA"
            git ls-tree -r --name-only "$CURRENT_SHA" > /tmp/changed-files.txt
          fi

      - name: Ruff changed Python files
        shell: bash
        run: |
          mapfile -t python_files < <(while IFS= read -r path; do
            if [[ "$path" == *.py && -f "$path" ]]; then printf '%s\n' "$path"; fi
          done < /tmp/changed-files.txt)
          if (( ${#python_files[@]} )); then
            ruff check "${python_files[@]}"
          fi

      - name: Compile Python sources
        run: python -m compileall -q backend scripts

      - name: Validate JSON schemas
        run: python scripts/ci/validate_json_schemas.py

      - name: Run CI contract tests
        run: |
          PYTHONPATH=backend:scripts:. pytest -q \
            backend/tests/unit/test_ci_backend_test_shards.py \
            backend/tests/unit/test_ci_cd_release_classifier.py \
            backend/tests/unit/test_ci_change_classifier.py \
            backend/tests/unit/test_ci_workflow_contract.py \
            backend/tests/unit/test_issue291_phase_a_release.py \
            backend/tests/unit/test_issue267_release_contract.py \
            backend/tests/unit/test_issue267_legacy_cd_guard.py \
            backend/tests/unit/test_pr_update_comment_gate.py

  legacy-cd-guard-plan:
    name: Legacy CD guard plan
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-quick.txt

      - name: Install guard-plan dependencies
        run: pip install -r scripts/ci/requirements-quick.txt

      - name: Resolve changed files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --name-only --no-renames "origin/$BASE_REF"...HEAD > /tmp/changed-files.txt
            echo "baseline_status=known" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --no-renames "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
            echo "baseline_status=known" >> "$GITHUB_OUTPUT"
          else
            git ls-tree -r --name-only "$CURRENT_SHA" > /tmp/changed-files.txt
            echo "baseline_status=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Produce inert release plan
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci/plan_legacy_cd_guard.py
          --paths-file /tmp/changed-files.txt
          --source-commit-sha "$CURRENT_SHA"
          --baseline-status "${{ steps.changed-files.outputs.baseline_status }}"
          --output artifacts/issue-267-legacy-cd-guard-plan.json

      - name: Upload release plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-267-legacy-cd-guard-plan-${{ github.run_id }}
          path: artifacts/issue-267-legacy-cd-guard-plan.json
          if-no-files-found: error
          retention-days: 30

  phase-a-release-plan:
    name: Issue #291 Phase A release plan
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-quick.txt

      - name: Install release-plan dependencies
        run: pip install -r scripts/ci/requirements-quick.txt

      - name: Resolve changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git ls-tree -r --name-only "$CURRENT_SHA" > /tmp/changed-files.txt
            echo known > /tmp/baseline-status.txt
            echo true > /tmp/force-all.txt
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --name-only --no-renames "origin/$BASE_REF"...HEAD > /tmp/changed-files.txt
            echo known > /tmp/baseline-status.txt
            echo false > /tmp/force-all.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --no-renames "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
            echo known > /tmp/baseline-status.txt
            echo false > /tmp/force-all.txt
          else
            git ls-tree -r --name-only "$CURRENT_SHA" > /tmp/changed-files.txt
            echo unknown > /tmp/baseline-status.txt
            echo false > /tmp/force-all.txt
          fi

      - name: Produce non-deploying Phase A plan
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          extra=()
          if [ "$(cat /tmp/force-all.txt)" = "true" ]; then extra+=(--force-all); fi
          python scripts/ci/plan_phase_a_release.py \
            --paths-file /tmp/changed-files.txt \
            --source-commit-sha "$CURRENT_SHA" \
            --baseline-status "$(cat /tmp/baseline-status.txt)" \
            --output artifacts/issue-291-phase-a-release-plan.json \
            "${extra[@]}"

      - name: Upload Phase A release plan
        if: always() && hashFiles('artifacts/issue-291-phase-a-release-plan.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: issue-291-phase-a-release-plan-${{ github.run_id }}
          path: artifacts/issue-291-phase-a-release-plan.json
          if-no-files-found: error
          retention-days: 30

  phase-a-build-check:
    name: Issue #291 Phase A images, Compose, health and contracts
    needs:
      - changes
      - phase-a-release-plan
    if: needs.phase-a-release-plan.result == 'success' && needs.changes.outputs.phase_a_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Phase A test dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate schemas, classifier and Phase A contracts
        run: |
          python scripts/ci/validate_json_schemas.py
          PYTHONPATH=backend:scripts:. pytest -q \
            backend/tests/unit/test_issue291_phase_a_release.py \
            backend/tests/unit/test_issue291_phase_a_contract.py \
            backend/tests/unit/test_issue291_phase_a_compose.py \
            backend/tests/unit/test_issue291_frontend_edge.py \
            backend/tests/unit/test_issue291_control_api.py \
            backend/tests/unit/test_issue291_phase_a_commands.py \
            backend/tests/unit/test_issue291_phase_a_durable_execution.py \
            backend/tests/unit/test_issue291_phase_a_leader_fencing.py

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend-edge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Containerfile
          load: true
          tags: vnpy-web-bridge-frontend:phase-a-${{ github.sha }}
          cache-from: type=gha,scope=issue291-frontend-edge
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=issue291-frontend-edge' || '' }}

      - name: Build control-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/phase-a/Containerfile.control-api
          load: true
          tags: vnpy-web-bridge-control-api:phase-a-${{ github.sha }}
          cache-from: type=gha,scope=issue291-control-api
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=issue291-control-api' || '' }}

      - name: Build execution-orchestrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/phase-a/Containerfile.execution-orchestrator
          load: true
          tags: vnpy-web-bridge-execution:phase-a-${{ github.sha }}
          cache-from: type=gha,scope=issue291-execution-orchestrator
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=issue291-execution-orchestrator' || '' }}

      - name: Build gateway proxy image (gateway-rpc-request-proxy + gateway-rpc-publish-proxy dependency units)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/phase-a/Containerfile.gateway-proxy
          load: true
          tags: vnpy-web-bridge-gateway-proxy:phase-a-${{ github.sha }}
          cache-from: type=gha,scope=issue291-gateway-proxy
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=issue291-gateway-proxy' || '' }}

      - name: Validate Phase A Compose configuration
        env:
          CONTROL_DATABASE_URL: postgresql://control:phase-a-control@postgres:5432/vnpy
          EXECUTION_DATABASE_URL: postgresql://execution:phase-a-execution@postgres:5432/vnpy
          CONTROL_EXECUTION_SHARED_SECRET: phase-a-ci-control-execution-secret-not-for-runtime
          CONTROL_EXECUTION_PRINCIPAL: phase-a-ci-control
          CONTROL_EXECUTION_ROLE: admin
          EXECUTION_SCOPE: account:phase-a-ci
          EXECUTION_ENVIRONMENT: phase-a-ci
          GATEWAY_RPC_REQ_PROXY_PORT: "2014"
          GATEWAY_RPC_PUB_PROXY_PORT: "4102"
          WINDOWS_RPC_REQ_ADDRESS: tcp://192.0.2.1:2014
          WINDOWS_RPC_PUB_ADDRESS: tcp://192.0.2.1:4102
          GATEWAY_PROXY_IMAGE: vnpy-web-bridge-gateway-proxy:phase-a-${{ github.sha }}
          JWT_SECRET_KEY: phase-a-ci-jwt-secret-not-for-runtime
          AUTH_USERS_JSON: '[{"username":"ci","password_sha256":"ci"}]'
          POSTGRES_DB: vnpy
          POSTGRES_ADMIN_USER: postgres
          POSTGRES_ADMIN_PASSWORD: phase-a
          CONTROL_DB_USER: control
          CONTROL_DB_PASSWORD: phase-a-control
          EXECUTION_DB_USER: execution
          EXECUTION_DB_PASSWORD: phase-a-execution
        run: >-
          docker compose -f deployments/docker-compose.phase-a.yml config --quiet

      - name: Check image entrypoints and health/version modules
        run: |
          docker image inspect vnpy-web-bridge-frontend:phase-a-${{ github.sha }} >/dev/null
          docker image inspect vnpy-web-bridge-control-api:phase-a-${{ github.sha }} >/dev/null
          docker image inspect vnpy-web-bridge-execution:phase-a-${{ github.sha }} >/dev/null
          docker image inspect vnpy-web-bridge-gateway-proxy:phase-a-${{ github.sha }} >/dev/null
          docker run --rm --entrypoint nginx vnpy-web-bridge-frontend:phase-a-${{ github.sha }} -t -c /etc/nginx/nginx.conf
          docker run --rm --entrypoint python vnpy-web-bridge-control-api:phase-a-${{ github.sha }} -c "from app.control_api import app; paths={getattr(r, 'path', '') for r in app.routes}; assert {'/health/live','/health/ready','/version'} <= paths"
          docker run --rm --entrypoint python vnpy-web-bridge-execution:phase-a-${{ github.sha }} -c "from app.execution_orchestrator import app; paths={getattr(r, 'path', '') for r in app.routes}; assert {'/health/live','/health/ready','/version'} <= paths"
          docker image inspect vnpy-web-bridge-gateway-proxy:phase-a-${{ github.sha }} | python -c "import json,sys; c=json.load(sys.stdin)[0]['Config']; assert c['Entrypoint'] == ['python','/usr/local/bin/gateway_proxy.py']; assert c['Cmd'] == ['request']; assert c['User'] == '65532:65532'"
          docker run --rm vnpy-web-bridge-gateway-proxy:phase-a-${{ github.sha }} version | python -c "import json,sys; value=json.load(sys.stdin); assert value['service'] == 'gateway-rpc-proxy'; assert value['version']"

  backend:
    name: Backend tests (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate deterministic shard manifest
        run: python scripts/ci/backend_test_shards.py validate

      - name: Run backend unit-test shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t test_files < <(python scripts/ci/backend_test_shards.py files --shard "$SHARD")
          PYTHONPATH=backend:scripts:. pytest "${test_files[@]}"

  frontend:
    name: Frontend build and tests
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend quality gate
        run: npm run check

  windows-fence-core:
    name: Windows fence foundation (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.windows_fence_changed == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install read-only test dependencies
        run: pip install -r scripts/ci/requirements-quick.txt

      - name: Run Windows fence offline tests
        run: >-
          python -m pytest -q
          backend/tests/unit/test_windows_rpc_deployment_snapshot_v1.py
          backend/tests/unit/test_windows_rpc_durable_fence_store_v1.py
          backend/tests/unit/test_windows_rpc_durable_fence_admission_v1.py
          backend/tests/unit/test_windows_rpc_durable_fence_bootstrap_v1.py
          backend/tests/unit/test_windows_rpc_durable_fence_bundle_v1.py
          backend/tests/unit/test_windows_rpc_durable_fence_manifest_v1.py
          backend/tests/unit/test_windows_rpc_durable_fence_target_contract_v1.py

  docker:
    name: Production image build
    needs: changes
    if: needs.changes.outputs.image_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vnpy-web-bridge:ci-${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=production' || '' }}

      - name: Build readiness-v4 verifier image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/c_fast_t1/Containerfile.readiness-v4
          build-args: SOURCE_REVISION=${{ github.sha }}
          load: true
          tags: vnpy-web-bridge-c-fast-readiness-v4:ci-${{ github.sha }}
          cache-from: type=gha,scope=readiness-v4
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=readiness-v4' || '' }}

  query-v5-real-oci:
    name: Query-v5 real OCI composition
    needs: changes
    if: needs.changes.outputs.query_v5_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-query-v5.txt

      - name: Install verifier dependencies
        run: pip install -r scripts/ci/requirements-query-v5.txt

      - name: Run query-v5 attestation closure tests
        run: |
          PYTHONPATH=backend:scripts pytest -q \
            backend/tests/unit/test_c_fast_t1_query_v3_image_attestation.py \
            backend/tests/unit/test_c_fast_t1_query_v4_image_attestation.py \
            backend/tests/unit/test_c_fast_t1_query_v4_runtime_packaging.py \
            backend/tests/unit/test_c_fast_t1_query_v5_image_attestation.py

      - name: Set up Buildx for local OCI registry
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: Build, export, and fully attest exact query-v5 composition
        shell: bash
        env:
          CACHE_WRITE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          docker run -d --rm --network host --name query-v5-ci-registry registry:2

          v4_repository="c-fast/query-v4"
          v4_tag="localhost:5000/${v4_repository}:${GITHUB_SHA}"
          v4_cache=(--cache-from type=gha,scope=query-v4)
          if [ "$CACHE_WRITE_ALLOWED" = "true" ]; then
            v4_cache+=(--cache-to type=gha,mode=max,scope=query-v4)
          fi
          docker buildx build --progress=plain --platform linux/amd64 \
            --provenance=false --sbom=false \
            "${v4_cache[@]}" \
            --output "type=registry,name=${v4_tag},oci-mediatypes=true" \
            -f scripts/c_fast_t1/Containerfile.query-v4 \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" .
          v4_digest="$(PYTHONPATH=scripts python \
            scripts/c_fast_t1/ci_query_v5_real_oci_attestation.py \
            export-registry-oci \
            --registry http://localhost:5000 \
            --repository "${v4_repository}" \
            --reference "${GITHUB_SHA}" \
            --output /tmp/query-v4.oci.tar | sed -n 's/^image_digest=//p')"
          test -n "${v4_digest}"
          v4_reference="localhost:5000/${v4_repository}@${v4_digest}"

          v5_repository="c-fast/query-v5"
          v5_tag="localhost:5000/${v5_repository}:${GITHUB_SHA}"
          v5_cache=(--cache-from type=gha,scope=query-v5)
          if [ "$CACHE_WRITE_ALLOWED" = "true" ]; then
            v5_cache+=(--cache-to type=gha,mode=max,scope=query-v5)
          fi
          docker buildx build --progress=plain --platform linux/amd64 \
            --provenance=false --sbom=false \
            "${v5_cache[@]}" \
            --output "type=registry,name=${v5_tag},oci-mediatypes=true" \
            -f scripts/c_fast_t1/Containerfile.query-v5 \
            --build-arg "QUERY_V4_BASE_IMAGE=${v4_reference}" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" .
          v5_digest="$(PYTHONPATH=scripts python \
            scripts/c_fast_t1/ci_query_v5_real_oci_attestation.py \
            export-registry-oci \
            --registry http://localhost:5000 \
            --repository "${v5_repository}" \
            --reference "${GITHUB_SHA}" \
            --output /tmp/query-v5.oci.tar | sed -n 's/^image_digest=//p')"
          test -n "${v5_digest}"
          v5_reference="localhost:5000/${v5_repository}@${v5_digest}"

          PYTHONPATH=scripts python \
            scripts/c_fast_t1/ci_query_v5_real_oci_attestation.py attest \
            --source-commit-sha "${GITHUB_SHA}" \
            --query-v4-oci /tmp/query-v4.oci.tar \
            --query-v4-image-reference "${v4_reference}" \
            --query-v5-oci /tmp/query-v5.oci.tar \
            --query-v5-image-reference "${v5_reference}"

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - quick-checks
      - legacy-cd-guard-plan
      - backend
      - frontend
      - windows-fence-core
      - docker
      - query-v5-real-oci
      - phase-a-release-plan
      - phase-a-build-check
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          invalid = {
              name: details["result"]
              for name, details in needs.items()
              if details["result"] not in {"success", "skipped"}
          }
          if needs["legacy-cd-guard-plan"]["result"] != "success":
              invalid["legacy-cd-guard-plan"] = needs["legacy-cd-guard-plan"]["result"]
          if invalid:
              raise SystemExit(f"required CI jobs failed or were cancelled: {invalid}")
          print("all applicable CI jobs succeeded; unrelated jobs may be skipped")
          PY
