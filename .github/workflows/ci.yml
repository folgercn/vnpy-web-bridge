name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend_changed }}
      frontend_changed: ${{ steps.filter.outputs.frontend_changed }}
      image_changed: ${{ steps.filter.outputs.image_changed }}
      query_v5_changed: ${{ steps.filter.outputs.query_v5_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/ci/classify_changes.py --force-all --github-output >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --name-only "origin/$BASE_REF"...HEAD > /tmp/changed-files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
          else
            git ls-tree -r --name-only "$CURRENT_SHA" > /tmp/changed-files.txt
          fi

          python scripts/ci/classify_changes.py \
            --paths-file /tmp/changed-files.txt \
            --github-output >> "$GITHUB_OUTPUT"

  quick-checks:
    name: Quick checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/ci/requirements-quick.txt
            backend/requirements.txt

      - name: Install quick-check dependencies
        run: pip install -r scripts/ci/requirements-quick.txt

      - name: Resolve changed files and check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --check "origin/$BASE_REF"...HEAD
            git diff --name-only "origin/$BASE_REF"...HEAD > /tmp/changed-files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA" "$CURRENT_SHA"
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
          else
            git show --check --oneline "$CURRENT_SHA"
            git ls-tree -r --name-only "$CURRENT_SHA" > /tmp/changed-files.txt
          fi

      - name: Ruff changed Python files
        shell: bash
        run: |
          mapfile -t python_files < <(while IFS= read -r path; do
            if [[ "$path" == *.py && -f "$path" ]]; then printf '%s\n' "$path"; fi
          done < /tmp/changed-files.txt)
          if (( ${#python_files[@]} )); then
            ruff check "${python_files[@]}"
          fi

      - name: Compile Python sources
        run: python -m compileall -q backend scripts

      - name: Validate JSON schemas
        run: python scripts/ci/validate_json_schemas.py

      - name: Run changed-area focused tests
        shell: bash
        run: |
          mapfile -t focused_tests < <(python scripts/ci/focused_tests.py \
            --paths-file /tmp/changed-files.txt)
          PYTHONPATH=backend:scripts:. pytest -q "${focused_tests[@]}"

  backend:
    name: Backend tests (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate deterministic shard manifest
        run: python scripts/ci/backend_test_shards.py validate

      - name: Run backend unit-test shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t test_files < <(python scripts/ci/backend_test_shards.py files --shard "$SHARD")
          PYTHONPATH=backend:scripts:. pytest "${test_files[@]}"

  frontend:
    name: Frontend build and tests
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker:
    name: Production image build
    needs: changes
    if: needs.changes.outputs.image_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vnpy-web-bridge:ci-${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=production' || '' }}

      - name: Build readiness-v4 verifier image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/c_fast_t1/Containerfile.readiness-v4
          build-args: SOURCE_REVISION=${{ github.sha }}
          load: true
          tags: vnpy-web-bridge-c-fast-readiness-v4:ci-${{ github.sha }}
          cache-from: type=gha,scope=readiness-v4
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=readiness-v4' || '' }}

  query-v5-real-oci:
    name: Query-v5 real OCI composition
    needs: changes
    if: needs.changes.outputs.query_v5_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-query-v5.txt

      - name: Install verifier dependencies
        run: pip install -r scripts/ci/requirements-query-v5.txt

      - name: Run query-v5 attestation closure tests
        run: |
          PYTHONPATH=backend:scripts pytest -q \
            backend/tests/unit/test_c_fast_t1_query_v3_image_attestation.py \
            backend/tests/unit/test_c_fast_t1_query_v4_image_attestation.py \
            backend/tests/unit/test_c_fast_t1_query_v4_runtime_packaging.py \
            backend/tests/unit/test_c_fast_t1_query_v5_image_attestation.py

      - name: Set up Buildx for local OCI registry
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: Build, export, and fully attest exact query-v5 composition
        shell: bash
        env:
          CACHE_WRITE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          docker run -d --rm --network host --name query-v5-ci-registry registry:2

          v4_repository="c-fast/query-v4"
          v4_tag="localhost:5000/${v4_repository}:${GITHUB_SHA}"
          v4_cache=(--cache-from type=gha,scope=query-v4)
          if [ "$CACHE_WRITE_ALLOWED" = "true" ]; then
            v4_cache+=(--cache-to type=gha,mode=max,scope=query-v4)
          fi
          docker buildx build --progress=plain --platform linux/amd64 \
            --provenance=false --sbom=false \
            "${v4_cache[@]}" \
            --output "type=registry,name=${v4_tag},oci-mediatypes=true" \
            -f scripts/c_fast_t1/Containerfile.query-v4 \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" .
          v4_digest="$(PYTHONPATH=scripts python \
            scripts/c_fast_t1/ci_query_v5_real_oci_attestation.py \
            export-registry-oci \
            --registry http://localhost:5000 \
            --repository "${v4_repository}" \
            --reference "${GITHUB_SHA}" \
            --output /tmp/query-v4.oci.tar | sed -n 's/^image_digest=//p')"
          test -n "${v4_digest}"
          v4_reference="localhost:5000/${v4_repository}@${v4_digest}"

          v5_repository="c-fast/query-v5"
          v5_tag="localhost:5000/${v5_repository}:${GITHUB_SHA}"
          v5_cache=(--cache-from type=gha,scope=query-v5)
          if [ "$CACHE_WRITE_ALLOWED" = "true" ]; then
            v5_cache+=(--cache-to type=gha,mode=max,scope=query-v5)
          fi
          docker buildx build --progress=plain --platform linux/amd64 \
            --provenance=false --sbom=false \
            "${v5_cache[@]}" \
            --output "type=registry,name=${v5_tag},oci-mediatypes=true" \
            -f scripts/c_fast_t1/Containerfile.query-v5 \
            --build-arg "QUERY_V4_BASE_IMAGE=${v4_reference}" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" .
          v5_digest="$(PYTHONPATH=scripts python \
            scripts/c_fast_t1/ci_query_v5_real_oci_attestation.py \
            export-registry-oci \
            --registry http://localhost:5000 \
            --repository "${v5_repository}" \
            --reference "${GITHUB_SHA}" \
            --output /tmp/query-v5.oci.tar | sed -n 's/^image_digest=//p')"
          test -n "${v5_digest}"
          v5_reference="localhost:5000/${v5_repository}@${v5_digest}"

          PYTHONPATH=scripts python \
            scripts/c_fast_t1/ci_query_v5_real_oci_attestation.py attest \
            --source-commit-sha "${GITHUB_SHA}" \
            --query-v4-oci /tmp/query-v4.oci.tar \
            --query-v4-image-reference "${v4_reference}" \
            --query-v5-oci /tmp/query-v5.oci.tar \
            --query-v5-image-reference "${v5_reference}"

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - quick-checks
      - backend
      - frontend
      - docker
      - query-v5-real-oci
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          invalid = {
              name: details["result"]
              for name, details in needs.items()
              if details["result"] not in {"success", "skipped"}
          }
          if invalid:
              raise SystemExit(f"required CI jobs failed or were cancelled: {invalid}")
          print("all applicable CI jobs succeeded; unrelated jobs may be skipped")
          PY
