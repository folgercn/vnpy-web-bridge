name: PR update comment gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: pr-update-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-update-comment:
    name: PR update comment gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Require update comment for current head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: pull_request_target
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_PUSHED_AT: ${{ github.event.pull_request.updated_at }}
        run: >-
          python scripts/ci/check_pr_update_comment.py
          --timeout-seconds 120
          --poll-interval-seconds 10
