pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # The service name is resolved on the private Compose network.  No
    # browser-facing route is allowed to reach any other Phase A service.
    upstream control_api {
        server control-api:8081;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Never log query strings: short-lived WebSocket tickets must not appear
    # in request-line logs even though they are single-use.
    log_format phase_a '$remote_addr $request_method $uri $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout phase_a;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Edge responses carry the same baseline protections, including error
        # responses. API/WS locations intentionally do not define an error
        # handler, so an upstream error can never become the SPA.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" always;

        location = /health/live {
            default_type application/json;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"ok","service":"frontend-edge"}';
        }

        location = /health/ready {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass http://control_api/health/ready;
            proxy_intercept_errors off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" always;
            add_header Cache-Control "no-store" always;
        }

        location = /version {
            default_type application/json;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"service":"frontend-edge","version":"static"}';
        }

        # Preserve the complete API path and request identity.  This location
        # has no static fallback: 4xx/5xx/502 remain API errors.
        location = /api {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header Connection "";
            proxy_pass http://control_api;
            proxy_intercept_errors off;
        }

        location ^~ /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header Connection "";
            proxy_pass http://control_api;
            proxy_intercept_errors off;
        }

        # WebSocket routes are separate from SPA routing and retain HTTP/1.1
        # upgrade semantics for the control-api event stream.
        location = /ws {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_pass http://control_api;
            proxy_intercept_errors off;
        }

        location ^~ /ws/ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_pass http://control_api;
            proxy_intercept_errors off;
        }

        # Vite's hashed output can be cached immutably.  Missing assets return
        # 404 rather than silently serving index.html.
        location ~* \.(?:css|js|mjs|map|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" always;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The entry document is intentionally revalidated on every navigation
        # so a static-asset release can roll back without stale HTML references.
        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" always;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # Vue Router history fallback applies only after the API/WS locations
        # above have matched, and only for browser document routes.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
